[project]
name = "discord-job-bot"
version = "0.1.0"
description = "Discord bot that polls job boards for entry-level/intern SWE roles"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "discord.py>=2.3",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
